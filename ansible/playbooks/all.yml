---
- name: Prepare all Docker hosts
  hosts: docker_hosts
  become: false
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/log_who_started_playbook.yml
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - common
    - alloy
  tags:
    - baseline

- name: Deploy Caddy
  hosts: caddy
  become: false
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - caddy
  tags:
    - caddy

- name: Deploy Authentik
  hosts: authentik
  become: false
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - authentik
  tags:
    - authentik

- name: Deploy Monitoring
  hosts: monitoring
  become: false
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - monitoring
  tags:
    - monitoring

- name: Deploy dnsmasq
  hosts: dnsmasq
  become: false
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - common
    - dnsmasq
  tags:
    - dnsmasq

- name: Deploy Nextcloud AIO
  hosts: nextcloud_aio
  become: false
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - common
    - nextcloud_aio
  tags:
    - nextcloud_aio
