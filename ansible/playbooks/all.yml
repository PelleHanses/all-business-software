# Playbook to deploy all services
---
- name: Deploy all services
  hosts: docker_hosts
  become: yes
  roles:
    - common

- name: Deploy Caddy
  hosts: caddy-server
  become: yes
  roles:
    - caddy

- name: Deploy Authentik
  hosts: authentik-server
  become: yes
  roles:
    - authentik

- name: Deploy Monitoring
  hosts: monitoring-server
  become: yes
  roles:
    - monitoring