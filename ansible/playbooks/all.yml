---
- name: Prepare all Docker hosts
  hosts: docker_hosts
  become: true
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/log_who_started_playbook.yml
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - common
    - alloy

- name: Deploy Caddy
  hosts: caddy-server
  become: true
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - caddy

- name: Deploy Authentik
  hosts: authentik-server
  become: true
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - authentik

- name: Deploy Monitoring
  hosts: monitoring-server
  become: true
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
  roles:
    - monitoring
