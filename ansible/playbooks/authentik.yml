# Playbook for Authentik setup
---
- name: Apply Authentik configuration
  hosts: authentik-server
  become: yes
  pre_tasks:
    - ansible.builtin.include_tasks: pre_tasks/log_who_started_playbook.yml
    - ansible.builtin.include_tasks: pre_tasks/verify_limit_arg.yml
    - ansible.builtin.include_tasks: pre_tasks/confirm.yml
  roles:
    - common
    - authentik