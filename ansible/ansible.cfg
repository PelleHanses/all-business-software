[defaults]
roles_path = ./roles
inventory = ./inventory/hosts.ini
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
bin_ansible_callbacks = True

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False

[callback_yaml]
show_custom = True

[galaxy]
server_list = galaxy, community

[ssh_connection]
pipelining = True

[vault]
# No vault configuration - secrets handled directly in compose files
vault_identity_list = []