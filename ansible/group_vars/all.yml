# Global variables
# Image versions - managed by Renovate
# These should NOT be changed manually

# Image versions (current as of 2024)
caddy_image_version: "2.7.5-alpine"
authentik_image_version: "2024.8.1"
prometheus_image_version: "v2.50.1"
grafana_image_version: "11.2.0"
loki_image_version: "3.0.0"
alloy_image_version: "1.3.0"

# Common variables
common_timezone: "Europe/Stockholm"
common_locale: "sv_SE.UTF-8"

# Docker Compose paths
compose_dir: "/opt/docker/compose"
compose_project_name: "{{ inventory_hostname }}"

# Caddy variables
caddy_config_dir: "{{ compose_dir }}/caddy"
caddy_config_file: "{{ caddy_config_dir }}/Caddyfile"

# Authentik variables
authentik_config_dir: "{{ compose_dir }}/authentik"
authentik_compose_file: "{{ authentik_config_dir }}/docker-compose.yml"

# Monitoring variables
monitoring_config_dir: "{{ compose_dir }}/monitoring"
monitoring_compose_file: "{{ monitoring_config_dir }}/docker-compose.yml"

# Service network
service_network: "{{ compose_project_name }}_services"

# Docker Compose common settings
docker_compose_restart_policy: "unless-stopped"
docker_compose_privileged: false