# tasks file for caddy
---
- name: Install Caddy
  apt:    name: caddy
    state: present
  become: yes

- name: Ensure Caddy config directory exists
  file:    path: /etc/caddy
    state: directory
    mode: '0755'
  become: yes

- name: Deploy Caddyfile
  template:    src: Caddyfile.j2
    dest: "{{ caddy_config_path }}"
    mode: '0644'
  become: yes
  notify: Restart Caddy

- name: Ensure Caddy is running and enabled
  service:    name: "{{ caddy_service_name }}"
    state: started
    enabled: yes
  become: yes

handlers:
  - name: Restart Caddy
    service:    name: "{{ caddy_service_name }}"
      state: restarted
    become: yes