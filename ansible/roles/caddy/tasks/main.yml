---
- name: Create Caddy configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0750"
  loop:
    - "{{ caddy_config_dir }}"
    - "{{ caddy_sites_dir }}"

- name: Create shared PHP document root
  ansible.builtin.file:
    path: "{{ caddy_php_root_dir }}"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0755"
  when: caddy_php_fpm_enabled | bool

- name: Deploy Caddy Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_config_dir }}/docker-compose.yml"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0600"
  notify: Restart Caddy

- name: Deploy the stable Caddyfile importer
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_file }}"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  notify: Restart Caddy
