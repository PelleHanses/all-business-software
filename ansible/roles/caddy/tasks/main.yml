---
- name: Create Caddy configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ caddy_config_dir }}"
    - "{{ caddy_sites_dir }}"

- name: Deploy Caddy Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_config_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Caddy

- name: Deploy the stable Caddyfile importer
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart Caddy
