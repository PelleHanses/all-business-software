---
authentik_config_dir: "{{ compose_dir }}/authentik"
authentik_compose_file: "{{ authentik_config_dir }}/docker-compose.yml"
authentik_image_version: "2026.8.5"
authentik_postgres_image: "postgres:16-alpine"
authentik_redis_image: "redis:7-alpine"
authentik_restart_policy: "{{ docker_compose_restart_policy }}"
authentik_bind_address: "{{ service_bind_address }}"
authentik_caddy_enabled: false
authentik_caddy_hostname: "authentik.example.com"
authentik_caddy_upstream: "{{ hostvars['authentik-server'].ansible_host }}:9000"
