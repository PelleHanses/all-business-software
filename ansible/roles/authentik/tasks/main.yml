---
- name: Validate required Authentik secrets
  ansible.builtin.assert:
    that:
      - authentik_secret_key is defined
      - authentik_secret_key | length >= 32
      - authentik_postgres_password is defined
      - authentik_postgres_password | length >= 16
    fail_msg: "Set authentik_secret_key and authentik_postgres_password in an encrypted inventory group_vars file."
  no_log: true

- name: Validate Caddy inventory group when Authentik proxying is enabled
  ansible.builtin.assert:
    that:
      - groups.get('caddy', []) | length > 0
    fail_msg: "authentik_caddy_enabled is true, but the inventory has no hosts in the [caddy] group."
  when: authentik_caddy_enabled | bool

- name: Create Authentik blueprint directory
  ansible.builtin.file:
    path: "{{ authentik_config_dir }}/blueprints"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0755"

- name: Deploy organization Authentik blueprint
  ansible.builtin.copy:
    src: organization.yaml
    dest: "{{ authentik_config_dir }}/blueprints/organization.yaml"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0644"

- name: Create Authentik application data directories
  ansible.builtin.file:
    path: "{{ authentik_config_dir }}/{{ item }}"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0750"
  loop:
    - media
    - custom_templates
    - certs

- name: Create Authentik PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ authentik_config_dir }}/postgres"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0700"

- name: Deploy Authentik Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ authentik_compose_file }}"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart Authentik

- name: Add or update Authentik Caddy site fragment
  ansible.builtin.template:
    src: caddy-site.caddy.j2
    dest: "{{ hostvars[caddy_host].caddy_sites_dir | default(compose_dir ~ '/caddy/sites') }}/authentik.caddy"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  delegate_to: "{{ caddy_host }}"
  when: authentik_caddy_enabled | bool
  notify: Reload Caddy after Authentik fragment update

- name: Remove Authentik Caddy fragment when proxying is disabled
  ansible.builtin.file:
    path: "{{ hostvars[caddy_host].caddy_sites_dir | default(compose_dir ~ '/caddy/sites') }}/authentik.caddy"
    state: absent
  delegate_to: "{{ caddy_host }}"
  when:
    - not (authentik_caddy_enabled | bool)
    - groups.get('caddy', []) | length > 0
  notify: Reload Caddy after Authentik fragment update
