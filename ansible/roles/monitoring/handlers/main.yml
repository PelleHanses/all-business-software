---
- name: Restart Monitoring
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_config_dir }}"
    state: present
  become: true

- name: Reload Caddy after Grafana fragment update
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - caddy
      - caddy
      - reload
      - --config
      - /etc/caddy/Caddyfile
    chdir: "{{ hostvars[caddy_host].caddy_config_dir | default(compose_dir ~ '/caddy') }}"
  delegate_to: "{{ caddy_host }}"
  changed_when: true
  become: true
