---
- name: Validate Grafana administrator password
  ansible.builtin.assert:
    that:
      - grafana_admin_password is defined
      - grafana_admin_password | length >= 16
    fail_msg: "Set grafana_admin_password in an encrypted inventory group_vars file."
  no_log: true

- name: Validate Caddy inventory group when Grafana proxying is enabled
  ansible.builtin.assert:
    that:
      - groups.get('caddy', []) | length > 0
    fail_msg: "monitoring_caddy_enabled is true, but the inventory has no hosts in the [caddy] group."
  when: monitoring_caddy_enabled | bool

- name: Create monitoring configuration directories
  ansible.builtin.file:
    path: "{{ monitoring_config_dir }}/{{ item }}"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0750"
  loop:
    - prometheus
    - loki
    - prometheus/data
    - grafana/data
    - loki/data

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_config_dir }}/prometheus/prometheus.yml"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  notify: Restart Monitoring

- name: Deploy Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ monitoring_config_dir }}/loki/loki.yml"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  notify: Restart Monitoring

- name: Deploy monitoring Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_compose_file }}"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart Monitoring

- name: Add or update Grafana Caddy site fragment
  ansible.builtin.template:
    src: grafana.caddy.j2
    dest: "{{ hostvars[caddy_host].caddy_sites_dir | default(compose_dir ~ '/caddy/sites') }}/grafana.caddy"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  delegate_to: "{{ caddy_host }}"
  when: monitoring_caddy_enabled | bool
  notify: Reload Caddy after Grafana fragment update

- name: Remove Grafana Caddy fragment when proxying is disabled
  ansible.builtin.file:
    path: "{{ hostvars[caddy_host].caddy_sites_dir | default(compose_dir ~ '/caddy/sites') }}/grafana.caddy"
    state: absent
  delegate_to: "{{ caddy_host }}"
  when:
    - not (monitoring_caddy_enabled | bool)
    - groups.get('caddy', []) | length > 0
  notify: Reload Caddy after Grafana fragment update
