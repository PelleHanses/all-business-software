---
monitoring_config_dir: "{{ compose_dir }}/monitoring"
monitoring_compose_file: "{{ monitoring_config_dir }}/docker-compose.yml"
prometheus_image_version: "v3.16.0"
grafana_image_version: "13.3.1"
loki_image_version: "3.7.0"
monitoring_restart_policy: "{{ docker_compose_restart_policy }}"
monitoring_bind_address: "{{ service_bind_address }}"
grafana_admin_user: "admin"
# Define this in Ansible Vault; no fallback/default password is provided.
prometheus_node_exporter_targets: []
monitoring_caddy_enabled: false
grafana_caddy_hostname: "grafana.example.com"
grafana_caddy_upstream: "{{ hostvars['monitoring-server'].ansible_host }}:3000"
