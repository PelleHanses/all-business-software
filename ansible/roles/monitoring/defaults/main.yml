# Defaults for monitoring role
# These can be overridden in group_vars or host_vars

# Monitoring configuration
monitoring_config_dir: "{{ compose_dir }}/monitoring"
monitoring_compose_file: "{{ monitoring_config_dir }}/docker-compose.yml"
prometheus_image_version: "{{ prometheus_image_version }}"
grafana_image_version: "{{ grafana_image_version }}"
loki_image_version: "{{ loki_image_version }}"
monitoring_restart_policy: "{{ docker_compose_restart_policy }}"

