# tasks file for prometheus
---
- name: Download Prometheus
  get_url:    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/prometheus.tar.gz
    mode: '0644'
  become: yes

- name: Extract Prometheus
  unarchive:    src: /tmp/prometheus.tar.gz
    dest: /tmp
    remote_src: yes
  become: yes

- name: Copy Prometheus binaries
  copy:    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/"
    dest: /usr/local/
    remote_src: yes
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0755'
  become: yes

- name: Ensure Prometheus config directory exists
  file:    path: /etc/prometheus
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0755'
  become: yes

- name: Deploy Prometheus config
  template:    src: prometheus.yml.j2
    dest: "{{ prometheus_config_path }}"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0644'
  become: yes
  notify: Restart Prometheus

- name: Create Prometheus systemd service
  template:    src: prometheus.service.j2
    dest: /etc/systemd/system/{{ prometheus_service_name }}.service
    mode: '0644'
  become: yes
  notify: Restart Prometheus

- name: Ensure Prometheus is running and enabled
  service:    name: "{{ prometheus_service_name }}"
    state: started
    enabled: yes
  become: yes

handlers:
  - name: Restart Prometheus
    service:    name: "{{ prometheus_service_name }}"
      state: restarted
    become: yes