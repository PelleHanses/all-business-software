---
- name: Validate dnsmasq DNS configuration
  ansible.builtin.assert:
    that:
      - dnsmasq_domain | length > 0
      - dnsmasq_listen_addresses | length > 0
      - dnsmasq_upstream_servers | length > 0
    fail_msg: "dnsmasq_domain, dnsmasq_listen_addresses and dnsmasq_upstream_servers must be configured."

- name: Validate DHCP configuration when enabled
  ansible.builtin.assert:
    that:
      - dnsmasq_dhcp_interface | length > 0
      - dnsmasq_dhcp_range_start | length > 0
      - dnsmasq_dhcp_range_end | length > 0
      - dnsmasq_dhcp_netmask | length > 0
      - dnsmasq_dhcp_router | length > 0
      - dnsmasq_dhcp_dns_servers | length > 0
    fail_msg: "DHCP is enabled but its interface, range, netmask, router or DNS servers are missing."
  when: dnsmasq_dhcp_enabled | bool

- name: Stop and disable any host-installed dnsmasq service
  ansible.builtin.systemd_service:
    name: dnsmasq.service
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove host-installed dnsmasq package
  ansible.builtin.apt:
    name: dnsmasq
    state: absent
    purge: false
    update_cache: false
  become: true

- name: Create dnsmasq application and persistent data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ dnsmasq_owner }}"
    group: "{{ dnsmasq_group }}"
    mode: "0750"
  loop:
    - "{{ dnsmasq_config_dir }}"
    - "{{ dnsmasq_data_dir }}"
  become: true

- name: Deploy dnsmasq configuration
  ansible.builtin.template:
    src: ansible-managed.conf.j2
    dest: "{{ dnsmasq_config_file }}"
    owner: "{{ dnsmasq_owner }}"
    group: "{{ dnsmasq_group }}"
    mode: "0640"
  notify: Restart dnsmasq
  become: true

- name: Deploy dnsmasq Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dnsmasq_compose_file }}"
    owner: "{{ dnsmasq_owner }}"
    group: "{{ dnsmasq_group }}"
    mode: "0640"
  notify: Restart dnsmasq
  become: true

- name: Validate dnsmasq configuration inside the container image
  community.docker.docker_container:
    name: dnsmasq-config-check
    image: "{{ dnsmasq_image }}"
    state: started
    cleanup: true
    network_mode: host
    capabilities:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    volumes:
      - "{{ dnsmasq_config_file }}:/etc/dnsmasq.conf:ro"
    entrypoint: ["/usr/sbin/dnsmasq"]
    command: ["--test", "--conf-file=/etc/dnsmasq.conf"]
    detach: false
  register: dnsmasq_config_check
  changed_when: false

- name: Start dnsmasq Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ dnsmasq_config_dir }}"
    state: present
