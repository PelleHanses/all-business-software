# tasks file for loki
---
- name: Download Loki
  get_url:    url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
    dest: /tmp/loki.zip
    mode: '0644'
  become: yes

- name: Extract Loki
  unarchive:    src: /tmp/loki.zip
    dest: /usr/local/bin
    remote_src: yes
    extra_opts: ['--transform', 's/.*/loki/']
  become: yes

- name: Ensure Loki config directory exists
  file:    path: /etc/loki
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0755'
  become: yes

- name: Deploy Loki config
  template:    src: loki.yml.j2
    dest: "{{ loki_config_path }}"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0644'
  become: yes
  notify: Restart Loki

- name: Create Loki systemd service
  template:    src: loki.service.j2
    dest: /etc/systemd/system/{{ loki_service_name }}.service
    mode: '0644'
  become: yes
  notify: Restart Loki

- name: Ensure Loki is running and enabled
  service:    name: "{{ loki_service_name }}"
    state: started
    enabled: yes
  become: yes

handlers:
  - name: Restart Loki
    service:    name: "{{ loki_service_name }}"
      state: restarted
    become: yes