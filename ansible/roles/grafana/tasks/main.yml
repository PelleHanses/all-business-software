# tasks file for grafana
---
- name: Add Grafana GPG key
  apt_key:    url: https://packages.grafana.com/gpg.key
    state: present
  become: yes

- name: Add Grafana repository
  apt_repository:    repo: "deb https://packages.grafana.com/oss/deb stable main"
    state: present
    filename: grafana.list
  become: yes

- name: Install Grafana
  apt:    name: grafana
    state: present
  become: yes

- name: Ensure Grafana config directory exists
  file:    path: /etc/grafana
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0755'
  become: yes

- name: Deploy Grafana config
  template:    src: grafana.ini.j2
    dest: "{{ grafana_config_path }}"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0644'
  become: yes
  notify: Restart Grafana

- name: Ensure Grafana is running and enabled
  service:    name: "{{ grafana_service_name }}"
    state: started
    enabled: yes
  become: yes

handlers:
  - name: Restart Grafana
    service:    name: "{{ grafana_service_name }}"
      state: restarted
    become: yes