---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install common packages and Docker Compose
  ansible.builtin.apt:
    name: "{{ common_packages + docker_packages }}"
    state: present
  become: true

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true

- name: Generate locale
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present
  become: true

- name: Create Compose root directory
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
