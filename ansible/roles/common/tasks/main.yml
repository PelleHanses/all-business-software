---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install common packages and Docker Compose
  ansible.builtin.apt:
    name: "{{ common_packages + docker_packages }}"
    state: present
  become: true

- name: Ensure the Ansible administration account has an interactive login shell
  ansible.builtin.user:
    name: "{{ common_admin_user }}"
    shell: "{{ common_admin_shell }}"
    create_home: true
    state: present
  become: true

- name: Add the Ansible account to the Docker group
  ansible.builtin.user:
    name: "{{ common_admin_user }}"
    groups: docker
    append: true
  become: true

- name: Refresh SSH connection to apply Docker group membership
  ansible.builtin.meta: reset_connection

- name: Ensure Docker is running and enabled at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true

- name: Generate locale
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present
  become: true

- name: Create application root directory
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create application directories owned by the Ansible account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0750"
  loop:
    - "{{ compose_dir }}/alloy"
    - "{{ compose_dir }}/caddy"
    - "{{ compose_dir }}/authentik"
    - "{{ compose_dir }}/monitoring"
    - "{{ compose_dir }}/nextcloud-aio"
  become: true
