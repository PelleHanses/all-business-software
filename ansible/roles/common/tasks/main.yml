# tasks file for common
---
- name: Update apt cache
  apt:
    update_cache: yes
  become: yes

- name: Install common packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - unzip
      - software-properties-common
      - docker.io
      - docker-compose-plugin
    state: present
  become: yes

- name: Ensure Docker is running
  service:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Set timezone
  timezone:
    name: "{{ common_timezone }}"
  become: yes

- name: Set locale
  locale_gen:
    name: "{{ common_locale }}"
    state: present
  become: yes

- name: Create compose directory
  file:
    path: "{{ compose_dir }}"
    state: directory
    mode: '0755'
  become: yes

- name: Create service directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  become: yes
  loop:
    - "{{ caddy_config_dir }}"
    - "{{ authentik_config_dir }}"
    - "{{ monitoring_config_dir }}"