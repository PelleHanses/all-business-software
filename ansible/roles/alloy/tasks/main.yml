# tasks file for alloy
---
- name: Download Alloy
  get_url:    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy_{{ alloy_version }}_linux_amd64.deb"
    dest: /tmp/alloy.deb
    mode: '0644'
  become: yes

- name: Install Alloy
  apt:    deb: /tmp/alloy.deb
  become: yes

- name: Ensure Alloy config directory exists
  file:    path: /etc/alloy
    state: directory
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0755'
  become: yes

- name: Deploy Alloy config
  template:    src: alloy.yml.j2
    dest: "{{ alloy_config_path }}"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_group }}"
    mode: '0644'
  become: yes
  notify: Restart Alloy

- name: Create Alloy systemd service
  template:    src: alloy.service.j2
    dest: /etc/systemd/system/{{ alloy_service_name }}.service
    mode: '0644'
  become: yes
  notify: Restart Alloy

- name: Ensure Alloy is running and enabled
  service:    name: "{{ alloy_service_name }}"
    state: started
    enabled: yes
  become: yes

handlers:
  - name: Restart Alloy
    service:    name: "{{ alloy_service_name }}"
      state: restarted
    become: yes