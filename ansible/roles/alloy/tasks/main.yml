---
- name: Create Alloy configuration directory
  ansible.builtin.file:
    path: "{{ alloy_config_dir }}"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0750"

- name: Create Alloy persistent data directory
  ansible.builtin.file:
    path: "{{ alloy_config_dir }}/data"
    state: directory
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0750"

- name: Grant Alloy container UID access to persistent data directory
  ansible.builtin.command:
    argv:
      - setfacl
      - -m
      - "u:473:rwx,d:u:473:rwx"
      - "{{ alloy_config_dir }}/data"
  changed_when: false

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_dir }}/config.alloy"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  notify: Restart Alloy

- name: Deploy Alloy Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ alloy_config_dir }}/docker-compose.yml"
    owner: "{{ docker_compose_owner }}"
    group: "{{ docker_compose_group }}"
    mode: "0640"
  notify: Restart Alloy
