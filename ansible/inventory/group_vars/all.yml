# Pinned stable container versions (review upgrades with Renovate).
caddy_image_version: "2.11.9-alpine"
authentik_image_version: "2026.8.5"
authentik_postgres_image: "postgres:16-alpine"
authentik_redis_image: "redis:7-alpine"
prometheus_image_version: "v3.16.0"
grafana_image_version: "13.3.1"
loki_image_version: "3.7.0"
alloy_image_version: "1.21.3"

# Host configuration
common_timezone: "Europe/Stockholm"
common_locale: "sv_SE.UTF-8"

# Compose projects are local to each Docker host.
compose_dir: "/opt/docker/compose"
docker_compose_restart_policy: "unless-stopped"

# Resolve the Caddy host from inventory rather than relying on its hostname.
caddy_host: "{{ (groups.get('caddy', []) | first) | default('') }}"

# Caddy is the central reverse proxy. App roles add independent fragments.
caddy_config_dir: "{{ compose_dir }}/caddy"
caddy_config_file: "{{ caddy_config_dir }}/Caddyfile"
caddy_sites_dir: "{{ caddy_config_dir }}/sites"
caddy_admin_email: "admin@example.com"
caddy_bind_address: "{{ service_bind_address }}"

# Service configuration directories
authentik_config_dir: "{{ compose_dir }}/authentik"
authentik_compose_file: "{{ authentik_config_dir }}/docker-compose.yml"
monitoring_config_dir: "{{ compose_dir }}/monitoring"
monitoring_compose_file: "{{ monitoring_config_dir }}/docker-compose.yml"

# Bind published service ports to each VM's private inventory address.
service_bind_address: "{{ ansible_host | default('127.0.0.1') }}"

# Reverse-proxy fragments are opt-in until real DNS names are configured.
authentik_caddy_enabled: false
authentik_caddy_hostname: "authentik.example.com"
authentik_caddy_upstream: "{{ hostvars[groups['authentik'] | first].ansible_host }}:9000"
monitoring_caddy_enabled: false
grafana_caddy_hostname: "grafana.example.com"
grafana_caddy_upstream: "{{ hostvars[groups['monitoring'] | first].ansible_host }}:3000"

# Explicit Prometheus node_exporter targets.
prometheus_node_exporter_targets: []
