# Inventory file for server hall

[common]
common-server ansible_host=192.168.1.10

[caddy]
caddy-server ansible_host=192.168.1.20

[authentik]
authentik-server ansible_host=192.168.1.30

[monitoring]
monitoring-server ansible_host=192.168.1.40

[all:vars]
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3