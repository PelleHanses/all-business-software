# Example inventory. Replace the addresses with the private IPs/DNS names of your VMs.
# "docker-host-01" is an ordinary Docker VM, not a special "common" server.

[docker_hosts]
docker-host-01 ansible_host=192.168.1.10
caddy-server ansible_host=192.168.1.20
authentik-server ansible_host=192.168.1.30
monitoring-server ansible_host=192.168.1.40

[observability]
monitoring-server

[all:vars]
# Connect over SSH as this ordinary local Linux account (never as root).
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519_ansible
ansible_python_interpreter=/usr/bin/python3
