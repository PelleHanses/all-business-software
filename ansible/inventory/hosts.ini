# Replace the example private IP addresses with your VM addresses.
# A host can belong to more than one service group when services are co-located.

[docker_hosts]
caddy-01 ansible_host=192.168.1.20
authentik-01 ansible_host=192.168.1.30
monitoring-01 ansible_host=192.168.1.40

[caddy]
caddy-01

[authentik]
authentik-01

[monitoring]
monitoring-01

[observability]
monitoring-01

[all:vars]
# Connect over SSH as this ordinary local Linux account (never as root).
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519_ansible
ansible_python_interpreter=/usr/bin/python3
